# Render Blueprint: API for the testing (staging) environment.
# Render > New > Blueprint > pick this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: motordesk-api-staging
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    branch: staging
    buildCommand: npm ci --include=dev && npm run build
    # Seeding is idempotent: it only adds missing plans and the super admin.
    startCommand: npm run seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: TZ
        value: Asia/Colombo
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_WEB_CONFIG
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: nuwanpriyamal@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
